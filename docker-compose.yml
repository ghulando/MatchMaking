version: '3.8'

services:
  # Infrastructure Services
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  # Initialize Kafka Topics
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # blocks until kafka is reachable
      kafka-topics --bootstrap-server kafka:29092 --list

      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic matchmaking.request --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic matchmaking.complete --replication-factor 1 --partitions 1

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  # Application Services
  matchmaking-service:
    build:
      context: ./src/MatchMaking.Service
      dockerfile: Dockerfile
    hostname: matchmaking-service
    container_name: matchmaking-service
    depends_on:
      - kafka
      - redis
      - kafka-init
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Kafka__BootstrapServers=kafka:29092
      - Redis__ConnectionString=redis:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/match/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  matchmaking-worker-1:
    build:
      context: ./src/MatchMaking.Worker
      dockerfile: Dockerfile
    hostname: matchmaking-worker-1
    container_name: matchmaking-worker-1
    depends_on:
      - kafka
      - redis
      - kafka-init
    environment:
      - Kafka__BootstrapServers=kafka:29092
      - Redis__ConnectionString=redis:6379
      - MatchMaking__PlayersPerMatch=3
    restart: unless-stopped

  matchmaking-worker-2:
    build:
      context: ./src/MatchMaking.Worker
      dockerfile: Dockerfile
    hostname: matchmaking-worker-2
    container_name: matchmaking-worker-2
    depends_on:
      - kafka
      - redis
      - kafka-init
    environment:
      - Kafka__BootstrapServers=kafka:29092
      - Redis__ConnectionString=redis:6379
      - MatchMaking__PlayersPerMatch=3
    restart: unless-stopped